<p class="sub">告诉我们您的原料与目标产量——工程师 24 小时内回复。</p>

</select></div>
<div class="f-row"><label>您的物料与目标产量 *</label><textarea name="message" placeholder="例：冻猪肋排 500 kg/h；土豆清洗线 2 t/h…" required></textarea></div>

</form>

<script>
(function(){
  var f=document.getElementById('inqForm'),b=document.getElementById('inqBtn'),r=document.getElementById('inqResult');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!f.checkValidity()){f.reportValidity();return;}
    var p={submission_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random())};
    ['name','country','email','im','product','message','website'].forEach(function(k){
      var el=f.querySelector('[name='+k+']'); if(el) p[k]=el.value;
    });
    p.lang='zh-CN';
    b.disabled=true;b.textContent='提交中…';
    fetch('/api/inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
    .then(function(res){return res.json().then(function(j){return {ok:res.ok,j:j};});})
    .then(function(t){
      f.style.display='none';r.style.display='block';
      if(t.j&&t.j.success){
        document.getElementById('inqResultTitle').textContent='感谢！我们已收到您的询盘。';
        document.getElementById('inqResultBody').innerHTML='询盘编号：<b>'+(t.j.ref||'-')+'</b><br>工程师将在 24 小时内回复您的邮箱 <b>'+p.email+'</b>。';
      }else{
        document.getElementById('inqResultTitle').textContent='提交失败';
        document.getElementById('inqResultBody').innerHTML='请直接发邮件：<a href="mailto:sales07@kaiwuzy.com">sales07@kaiwuzy.com</a>';
      }
      r.scrollIntoView({behavior:'smooth'});
    })
    .catch(function(){
      f.style.display='none';r.style.display='block';
      document.getElementById('inqResultTitle').textContent='网络错误';
      document.getElementById('inqResultBody').innerHTML='请直接发邮件：<a href="mailto:sales07@kaiwuzy.com">sales07@kaiwuzy.com</a>';
      r.scrollIntoView({behavior:'smooth'});
    });
  });
})();
</script>
